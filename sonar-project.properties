# sonar-project.properties
# Configuracion del analisis de SonarQube para envios-service.
# Nota: mvn sonar:sonar toma estos mismos valores del pom.xml (el escaner de Maven no lee
# este archivo); aqui quedan para el escaner de linea de comandos (sonar-scanner) y como referencia.

# Identidad del proyecto en SonarQube: la clave debe coincidir con la creada en el servidor.
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Codigo de produccion y de pruebas que se analiza.
sonar.sources=src/main/java
sonar.tests=src/test/java

# Clases compiladas: las reglas de Java las necesitan para resolver tipos (exige mvn verify antes).
sonar.java.binaries=target/classes

# Reporte XML de JaCoCo que genera mvn verify; de aqui sale la cobertura de lineas y ramas.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor de SonarQube Community levantado con Docker en el puerto 9000.
sonar.host.url=http://localhost:9000

# No detener el build si falla la Quality Gate: el resultado se revisa y documenta en el dashboard.
sonar.qualitygate.wait=false

# Exclusiones (Decision de diseno 2): no se excluye ninguna clase, porque todo el codigo
# de main es logica de negocio y no hay una clase de arranque sin logica propia.
# sonar.exclusions=
